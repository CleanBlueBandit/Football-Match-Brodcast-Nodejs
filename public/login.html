<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --accent:    #ffcc00;
      --bg:        #0b0b0f;
      --surface:   #14141a;
      --surface2:  #0e0e12;
      --border:    #22222b;
      --border2:   #2a2a35;
      --text:      #e6e6e6;
      --muted:     #888;
      --error:     #e63946;
      --font-main: 'Segoe UI', system-ui, -apple-system, sans-serif;
      --radius:    8px;
    }

    html, body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-main);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .card {
      width: 100%;
      max-width: 380px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 2.25rem 2rem;
    }

    .card-header { margin-bottom: 2rem; }

    .eyebrow {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 0.5rem;
    }

    .card-title {
      font-size: 22px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .error-box {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      background: rgba(230,57,70,0.1);
      border: 1px solid rgba(230,57,70,0.3);
      border-radius: var(--radius);
      padding: 0.7rem 0.9rem;
      margin-bottom: 1.5rem;
      color: var(--error);
      font-size: 13px;
      display: none;
    }
    .error-box.visible { display: flex; }

    .field { margin-bottom: 1.1rem; }

    label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .input-wrap { position: relative; }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border2);
      border-radius: var(--radius);
      padding: 10px 12px;
      color: var(--text);
      font-family: var(--font-main);
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
      -webkit-appearance: none;
    }

    input[type="text"]:focus,
    input[type="password"]:focus { border-color: #555; }

    .btn-submit {
      width: 100%;
      margin-top: 0.75rem;
      padding: 10px 16px;
      background: var(--accent);
      color: #1a1a1a;
      border: 1px solid var(--accent);
      border-radius: var(--radius);
      font-family: var(--font-main);
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s;
    }
    .btn-submit:hover { background: #ffe066; transform: translateY(-1px); }
    .btn-submit:active { transform: translateY(0); }
    .btn-submit:disabled { opacity: 0.6; cursor: default; transform: none; }

    @media (max-width: 440px) {
      .card { padding: 1.75rem 1.25rem; }
    }
  </style>
</head>
<body>

<div class="card">
  <div class="card-header">
    <p class="eyebrow">Control Panel</p>
    <h1 class="card-title">Sign In</h1>
  </div>

  <div class="error-box" id="error-box"></div>

  <form id="login-form">
    <div class="field">
      <label for="username">Username</label>
      <div class="input-wrap">
        <input type="text" id="username" name="username" placeholder="your_username" autocomplete="username" required>
      </div>
    </div>

    <div class="field">
      <label for="password">Password</label>
      <div class="input-wrap">
        <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" required>
      </div>
    </div>

    <button type="submit" class="btn-submit" id="submit-btn">Sign In</button>
  </form>
</div>

<script>
  const form = document.getElementById('login-form');
  const errorBox = document.getElementById('error-box');
  const submitBtn = document.getElementById('submit-btn');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorBox.classList.remove('visible');
    submitBtn.disabled = true;
    submitBtn.textContent = 'Signing in...';

    const body = {
      username: document.getElementById('username').value,
      password: document.getElementById('password').value,
    };

    try {
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      const data = await res.json();

      if (res.ok) {
        window.location.href = data.redirect || '/control.html';
        return;
      }

      errorBox.textContent = data.error || 'Login failed.';
      errorBox.classList.add('visible');
    } catch (err) {
      errorBox.textContent = 'Network error. Please try again.';
      errorBox.classList.add('visible');
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Sign In';
    }
  });
</script>
</body>
</html>
